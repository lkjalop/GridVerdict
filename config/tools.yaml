# GridVerdict MCP tool registry
# All tools are read-only by policy — GridVerdict never writes to external systems.
# The security observer's pass_tool_output() screens every result before use.

tools:

  - name: aemo_dispatch_price
    description: "Live 5-minute dispatch price from NEMWeb (public, no auth)"
    category: dispatch
    endpoint: "https://nemweb.com.au/Reports/Current/DispatchIS_Reports/"
    read_only: true
    requires_auth: false
    poll_interval_s: 300
    staleness_threshold_s: 600
    enabled: true

  - name: aemo_market_notices
    description: "Active AEMO market notices: LOR, outages, RECLASSIFY, DIRECTIONS"
    category: notices
    endpoint: "https://nemweb.com.au/Reports/Current/Market_Notice/"
    read_only: true
    requires_auth: false
    poll_interval_s: 60
    staleness_threshold_s: 120
    enabled: true

  - name: aemo_archive
    description: "NEMWeb archive for historical dispatch price backfill (MMSDM)"
    category: archive
    endpoint: "https://nemweb.com.au/Data_Archive/Wholesale_Electricity/MMSDM/"
    read_only: true
    requires_auth: false
    poll_interval_s: 3600
    staleness_threshold_s: 7200
    enabled: true

  - name: hippograph_analogs
    description: "In-process HippoGraph PPR: retrieve historical analog market states"
    category: analogs
    endpoint: "internal:hippograph"
    read_only: true
    requires_auth: false
    poll_interval_s: 0
    staleness_threshold_s: 300
    enabled: true

  - name: lnn_forecast
    description: "LTC neural network quantile forecast P10/P50/P90 (in-process)"
    category: forecast
    endpoint: "internal:lnn_trainer"
    read_only: true
    requires_auth: false
    poll_interval_s: 0
    staleness_threshold_s: 300
    enabled: true

  - name: live_quantile_forecast
    description: "Live LEAR/QRA/LNN quantile forecast bands trained from persisted dispatch history"
    category: forecast
    endpoint: "internal:live_forecast"
    read_only: true
    requires_auth: false
    poll_interval_s: 300
    staleness_threshold_s: 600
    enabled: true

  - name: aemo_predispatch
    description: "AEMO pre-dispatch 30-min ahead RRP intervals (up to ~2 hours) from NEMWeb"
    category: forecast
    endpoint: "https://nemweb.com.au/Reports/Current/PredispatchIS_Reports/"
    read_only: true
    requires_auth: false
    poll_interval_s: 300
    staleness_threshold_s: 600
    enabled: true

  - name: nem_news_rss
    description: "Public RSS/Atom energy market commentary filtered for NEM-relevant keywords"
    category: sentiment
    endpoint: "rss:configured"
    read_only: true
    requires_auth: false
    poll_interval_s: 300
    staleness_threshold_s: 600
    enabled: true

  - name: weather_consensus
    description: "Read-only weather consensus from BOM observations, Open-Meteo, and MET Norway for NEM-relevant demand/renewables context"
    category: weather
    endpoint: "multi:open_meteo,met_no,bom_observations"
    read_only: true
    requires_auth: false
    poll_interval_s: 300
    staleness_threshold_s: 900
    enabled: true

  - name: fcas_prices
    description: "FCAS market clearing prices (8 services: raise/lower × 6s/60s/5min/reg) from AEMO DISPATCHPRICE — used for BESS opportunity valuation"
    category: fcas
    endpoint: "internal:fcas_price_events"
    read_only: true
    requires_auth: false
    poll_interval_s: 300
    staleness_threshold_s: 600
    enabled: true

  - name: bom_7day_forecast
    description: "7-day daily weather forecast per NEM region (Open-Meteo daily API) — temperature, wind, solar irradiance, precipitation for LNN scenario injection"
    category: weather
    endpoint: "https://api.open-meteo.com/v1/forecast"
    read_only: true
    requires_auth: false
    poll_interval_s: 3600
    staleness_threshold_s: 7200
    enabled: true

  - name: gas_market_state
    description: "East coast gas hub prices (AEMO STTM) + ACCC LNG netback context — Wallumbilla/STTM settlement prices, implied SRMC for CCGT/OCGT, gas-electricity nexus evidence"
    category: gas
    endpoint: "https://www.aemo.com.au/aemo/apps/api/report/STTM_TRADING_HUB"
    read_only: true
    requires_auth: false
    poll_interval_s: 86400
    staleness_threshold_s: 172800
    enabled: true

  - name: isp_scenario
    description: "AEMO ISP 2024 scenario price trajectories (Step Change, Slow Change) + coal retirement schedule + REZ pipeline — long-run NEM price context"
    category: planning
    endpoint: "internal:isp_client"
    read_only: true
    requires_auth: false
    poll_interval_s: 0
    staleness_threshold_s: 31536000
    enabled: true

  - name: lcoe_sensitivity
    description: "CSIRO GenCost 2023-24 LCOE sensitivity analysis — technology cost comparison at variable discount rates, rate-change impact across solar/wind/gas/coal"
    category: analysis
    endpoint: "internal:lcoe_sensitivity_engine"
    read_only: true
    requires_auth: false
    poll_interval_s: 0
    staleness_threshold_s: 31536000
    enabled: true

  - name: fiscal_budget
    description: "Australian Government Budget energy measures knowledge base — ARENA, CEFC, CIS, Rewiring the Nation, hydrogen, transmission programs and their NEM price impact"
    category: policy
    endpoint: "internal:fiscal_budget_client"
    read_only: true
    requires_auth: false
    poll_interval_s: 0
    staleness_threshold_s: 7776000
    enabled: true
